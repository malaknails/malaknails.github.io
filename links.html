<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malak Nails Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@500;600;700&display=swap">
<style>
/* One centred column of big tap-friendly buttons; single colourful look by choice */
:root {
  --bg: #FFF8F4;
  --ink: #24132E;
  --muted: #5C4A63;
  --pink: #C2185B;
  --pink-soft: #FFE3EE;
  --lilac: #EFE6FF;
  --mint: #D6F5E8;
  --peach: #FFD9C7;
  --display: 'Syne', 'Arial Black', sans-serif;
  --body: 'Manrope', system-ui, sans-serif;
  color-scheme: light;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap {
  max-width: 440px; margin: 0 auto;
  padding-block: 48px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center;
}
.nails { display: flex; align-items: flex-end; gap: 10px; height: 110px; background: var(--peach); border-radius: 28px; padding: 0 28px 22px; }
.nail { width: 30px; border-radius: 50% 50% 9px 9px / 42% 42% 9px 9px; }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1; text-wrap: balance; }
.tag { margin: 8px 0 0; color: var(--muted); font-size: 16px; font-weight: 600; }
.links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 60px; padding: 14px 22px; border-radius: 999px;
  font-weight: 700; font-size: 17px; text-decoration: none; color: var(--ink);
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn svg { flex: none; }
.primary { background: var(--pink); color: #FFFFFF; }
.lilac { background: var(--lilac); }
.mint { background: var(--mint); }
.number { font-size: 15px; color: var(--muted); }
.number strong { color: var(--ink); user-select: all; }
footer { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
</style>
<style>body{margin:0}</style>
</head>
<body>


<main class="wrap">
  <div class="nails" role="img" aria-label="Five painted nails in pink, orange, purple, lilac and mint">
    <div class="nail" style="height:58px;background:#C2185B"></div>
    <div class="nail" style="height:74px;background:#FF8A5B"></div>
    <div class="nail" style="height:86px;background:#7B3FE4"></div>
    <div class="nail" style="height:76px;background:#C9B2FF"></div>
    <div class="nail" style="height:56px;background:#2FA38A"></div>
  </div>

  <div>
    <h1>Malak Nails</h1>
    <p class="tag">Rubber gel · Gel-X · Extensions · Pedicure</p>
  </div>

  <nav class="links" aria-label="Links">
    <a class="btn primary" href="https://wa.me/96171083936?text=Hi%20Malak!%20I%20would%20like%20to%20book%20an%20appointment.">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>
      Book on WhatsApp
    </a>
    <a class="btn lilac" href="https://rawad1198.github.io/malak-nails/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
      Prices &amp; website
    </a>
    <a class="btn mint" href="https://www.instagram.com/malak__nails___">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.8"></circle></svg>
      Instagram @malak__nails___
    </a>
  </nav>

  <p class="number">WhatsApp: <strong>+961 71 083 936</strong></p>
  <footer>By appointment only</footer>
</main>

</body>
</html>
